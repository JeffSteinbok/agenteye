# Reusable workflow: Build Windows installer (PyInstaller + Inno Setup)
name: Build Windows Installer

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string to embed in the installer (e.g. 1.3.0)'
        required: false
        type: string
        default: ''
    outputs:
      artifact-name:
        description: 'Name of the uploaded installer artifact'
        value: ${{ jobs.build-installer.outputs.artifact-name }}

jobs:
  build-installer:
    name: Windows Installer
    runs-on: windows-latest
    outputs:
      artifact-name: ${{ steps.upload.outputs.artifact-name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pywin32 pywinauto
          pip install pyinstaller

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(python -c "exec(open('src/__version__.py').read()); print(__version__)")
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Build executable with PyInstaller
        run: |
          pyinstaller installer/windows/agenteye.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ^
            /DMyAppVersion=${{ steps.version.outputs.version }} ^
            /DDistDir=..\..\dist\AgentEye ^
            installer\windows\agenteye.iss

      - name: Upload installer artifact
        id: upload
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          path: dist/installer/AgentEyeSetup-*.exe
          if-no-files-found: error
